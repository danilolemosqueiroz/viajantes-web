# Publica o site na Cloudflare.
#   push na master  -> produção (viajantesapp.com.br)
#   pull request    -> versão de prévia (URL própria, não afeta o site no ar)
#
# Configurar uma vez em GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#              CLOUDFLARE_ACCOUNT_ID (75728a458840a1518e83bed6df0105dc)
#   Variables: as VITE_* do .env (são públicas: vão dentro do JavaScript)
name: Deploy Cloudflare

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O .env não vai para o Git: o build lê os valores das Variables do repositório.
      - name: Gerar .env do build
        run: |
          cat > .env <<ENV
          VITE_API_URL=${{ vars.VITE_API_URL }}
          VITE_API_SITE_KEY=${{ vars.VITE_API_SITE_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID=${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID=${{ vars.VITE_APPLE_SERVICES_ID }}
          VITE_APPLE_REDIRECT_URI=${{ vars.VITE_APPLE_REDIRECT_URI }}
          VITE_PAGARME_PUBLIC_KEY=${{ vars.VITE_PAGARME_PUBLIC_KEY }}
          VITE_OFERTAS_API_URL=${{ vars.VITE_OFERTAS_API_URL }}
          VITE_IA_URL=${{ vars.VITE_IA_URL }}
          VITE_IA_APP_KEY=${{ vars.VITE_IA_APP_KEY }}
          VITE_BASE=
          ENV

      # typecheck + build (o mesmo `npm run build` de sempre)
      - run: npm run build

      - name: Produção
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Prévia
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: versions upload --message PR-${{ github.event.number }}
